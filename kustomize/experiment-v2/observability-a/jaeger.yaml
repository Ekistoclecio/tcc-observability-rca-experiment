apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-a
  labels:
    app: jaeger-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger-a
  template:
    metadata:
      labels:
        app: jaeger-a
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          env:
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: :9411
          ports:
            - name: query
              containerPort: 16686
            - name: zipkin
              containerPort: 9411
          readinessProbe:
            httpGet:
              path: /
              port: query
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-a
spec:
  selector:
    app: jaeger-a
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: zipkin
      port: 9411
      targetPort: zipkin
