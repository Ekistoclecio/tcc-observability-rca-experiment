apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tcc-prometheus-a
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcc-prometheus-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tcc-prometheus-a
subjects:
  - kind: ServiceAccount
    name: prometheus-a
    namespace: observability-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-a-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: application-a
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [online-boutique]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: (.+);(.+)
            target_label: __address__
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: sut-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.+)
            target_label: __address__
            replacement: ${1}:10250
        metric_relabel_configs:
          - source_labels: [namespace]
            action: keep
            regex: online-boutique
          - source_labels: [pod]
            action: keep
            regex: (frontend|checkoutservice|cartservice|productcatalogservice|currencyservice|paymentservice|shippingservice|emailservice|recommendationservice|adservice|redis-cart)-.*
          - source_labels: [container]
            action: drop
            regex: POD
          - source_labels: [__name__]
            action: keep
            regex: container_cpu_usage_seconds_total
          - source_labels: [pod]
            regex: (frontend|checkoutservice|cartservice|productcatalogservice|currencyservice|paymentservice|shippingservice|emailservice|recommendationservice|adservice|redis-cart)-.*
            target_label: service_name
            replacement: ${1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-a
  labels:
    app: prometheus-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-a
  template:
    metadata:
      labels:
        app: prometheus-a
    spec:
      serviceAccountName: prometheus-a
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-a-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-a
spec:
  selector:
    app: prometheus-a
  ports:
    - name: http
      port: 9090
      targetPort: http
