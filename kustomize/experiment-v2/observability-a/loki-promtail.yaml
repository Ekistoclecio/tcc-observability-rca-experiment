apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-a-config
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      filesystem:
        directory: /var/loki/chunks
    limits_config:
      retention_period: 24h
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-a
  labels:
    app: loki-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-a
  template:
    metadata:
      labels:
        app: loki-a
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.5.5
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /var/loki
      volumes:
        - name: config
          configMap:
            name: loki-a-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-a
spec:
  selector:
    app: loki-a
  ports:
    - name: http
      port: 3100
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-a
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tcc-promtail-a
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcc-promtail-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tcc-promtail-a
subjects:
  - kind: ServiceAccount
    name: promtail-a
    namespace: observability-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-a-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki-a:3100/loki/api/v1/push
    scrape_configs:
      - job_name: online-boutique
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [online-boutique]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_pod_name, __meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: ";"
            regex: (.+);(.+);(.+);(.+)
            target_label: __path__
            replacement: /var/log/pods/$1_$2_$3/$4/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail-a
  labels:
    app: promtail-a
spec:
  selector:
    matchLabels:
      app: promtail-a
  template:
    metadata:
      labels:
        app: promtail-a
    spec:
      serviceAccountName: promtail-a
      containers:
        - name: promtail
          image: grafana/promtail:3.5.5
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          ports:
            - name: http
              containerPort: 9080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 30m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            - name: positions
              mountPath: /run/promtail
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: promtail-a-config
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath:
            path: /var/log/pods
