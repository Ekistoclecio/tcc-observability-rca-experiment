apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-b
  labels:
    app: jaeger-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger-b
  template:
    metadata:
      labels:
        app: jaeger-b
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /
              port: query
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-b
spec:
  selector:
    app: jaeger-b
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
