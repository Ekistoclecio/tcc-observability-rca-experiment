apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-b
  labels:
    app: jaeger-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger-b
  template:
    metadata:
      labels:
        app: jaeger-b
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          args:
            - --badger.ephemeral=false
            - --badger.directory-value=/badger/data
            - --badger.directory-key=/badger/key
            - --badger.span-store-ttl=168h0m0s
            - --badger.consistency=true
          env:
            - name: SPAN_STORAGE_TYPE
              value: badger
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /
              port: query
          volumeMounts:
            - name: trace-storage
              mountPath: /badger
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: trace-storage
          persistentVolumeClaim:
            claimName: jaeger-b-traces
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-b
spec:
  selector:
    app: jaeger-b
  ports:
    - name: query
      port: 16686
      targetPort: query
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger-b-traces
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
