apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: otel-collector.observability-otel.svc.cluster.local:4317
            - name: OTEL_SERVICE_NAME
              value: frontend
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.version=0.10.7,deployment.environment.name=tcc-local
            - name: OTEL_TRACES_SAMPLER
              value: always_on
---
