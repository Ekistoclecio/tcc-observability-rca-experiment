apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-conventional-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        telemetry_scenario: conventional
    scrape_configs:
      - job_name: online-boutique-conventional
        metrics_path: /metrics
        static_configs:
          - targets:
              - frontend.default.svc.cluster.local:9464
              - checkoutservice.default.svc.cluster.local:9464
              - cartservice.default.svc.cluster.local:9464
              - productcatalogservice.default.svc.cluster.local:9464
              - currencyservice.default.svc.cluster.local:9464
              - paymentservice.default.svc.cluster.local:9464
              - shippingservice.default.svc.cluster.local:9464
              - emailservice.default.svc.cluster.local:9464
              - recommendationservice.default.svc.cluster.local:9464
              - adservice.default.svc.cluster.local:9464
      - job_name: tcc-sut-cadvisor
        scrape_interval: 5s
        scheme: https
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            regex: (.+)
            target_label: __address__
            replacement: $1:10250
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: default
            action: keep
          - source_labels: [pod]
            regex: (frontend|checkoutservice|cartservice|productcatalogservice|currencyservice|paymentservice|shippingservice|emailservice|recommendationservice|adservice|redis-cart)-.*
            action: keep
          - source_labels: [container]
            regex: POD
            action: drop
          - source_labels: [container]
            regex: .+
            action: keep
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total
            action: keep
          - source_labels: [pod]
            regex: (frontend|checkoutservice|cartservice|productcatalogservice|currencyservice|paymentservice|shippingservice|emailservice|recommendationservice|adservice|redis-cart)-.*
            target_label: service_name
            replacement: $1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-conventional
  labels:
    app: prometheus-conventional
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-conventional
  template:
    metadata:
      labels:
        app: prometheus-conventional
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-conventional-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-conventional
spec:
  selector:
    app: prometheus-conventional
  ports:
    - name: http
      port: 9090
      targetPort: http
