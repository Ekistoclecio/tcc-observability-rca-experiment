apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcc-cadvisor-reader
  namespace: observability-conventional
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tcc-cadvisor-reader
  namespace: observability-otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tcc-cadvisor-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcc-cadvisor-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tcc-cadvisor-reader
subjects:
  - kind: ServiceAccount
    name: tcc-cadvisor-reader
    namespace: observability-conventional
  - kind: ServiceAccount
    name: tcc-cadvisor-reader
    namespace: observability-otel
